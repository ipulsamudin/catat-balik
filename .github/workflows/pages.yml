name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Biarkan deploy yang sedang berjalan selesai, jangan dibatalkan di tengah.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  uji:
    name: Uji perhitungan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Self-test perhitungan (tanpa dependensi)
        run: node tools/selftest.mjs
      - name: Periksa import, aset precache, dan rujukan HTML
        run: node tools/cek-impor.mjs
      - name: Uji asap di browser headless
        # Runner GitHub sudah punya Chrome; bila tidak ada, skripnya melewati diri sendiri.
        run: node tools/smoke.mjs

  deploy:
    name: Deploy
    needs: uji
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Tidak ada proses build: seluruh isi repo adalah situsnya.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
