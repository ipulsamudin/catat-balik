  <span id="banner-text"></span>
  <span class="banner-actions">
    <button type="button" id="banner-action" class="btn btn-sm" hidden></button>
    <button type="button" id="banner-close" class="btn btn-sm btn-ghost" aria-label="Tutup">&times;</button>
  </span>
</div>

<header class="app-header">
  <a class="brand" href="#/">

    <span>Catat Balik</span>

<!-- Dialog konfirmasi (pengganti window.confirm). method="dialog" membuat
     tombol menutup sendiri dan mengisi returnValue; Esc memberi nilai kosong
     yang diperlakukan sebagai batal. -->
<dialog id="sheet" class="sheet" aria-labelledby="sheet-judul">
  <form method="dialog" class="sheet-isi">
    <h2 id="sheet-judul">Konfirmasi</h2>
    <p class="sheet-teks" id="sheet-teks"></p>
    <div class="sheet-aksi">
      <button type="submit" value="batal" class="btn" id="sheet-batal">Batal</button>
      <button type="submit" value="ya" class="btn btn-primary" id="sheet-ya">Lanjutkan</button>
    </div>
  </form>
</dialog>
